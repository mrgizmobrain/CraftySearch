org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric for Minecraft 26.2 (Loom 1.17, Gradle 9.5.1, Java 25)
minecraft_version=26.2
loader_version=0.19.5
fabric_api_version=0.161.0+26.2
# Optional integration (settings button in the mod list)
modmenu_version=20.0.3
# Claim mods the server's protection checks know (compile only)
opac_version=fabric-26.2-0.33.0
flan_version=26.2-1.12.8-fabric
common_protection_version=2.0.0
# Recipe viewers the panel keeps clear of (compile only).
# Modrinth's Maven picks any loader's file for a version number several loaders share,
# so those are pinned by Modrinth version id: jei j62WSkzi = 30.48.0.244 for Fabric.
jei_version=j62WSkzi
rei_version=26.2.820+fabric
basic_math_version=0.6.1
# Only for trying integrations in runClient with -Pwith=... (see build.gradle.kts).
# mezzconfig E4R9OPp6 = 0.6.11 Fabric; forge-config-api-port rSd3GiG8 = 26.2.1 Fabric.
mezzconfig_version=E4R9OPp6
architectury_version=21.1.12+fabric
cloth_config_version=26.2.155+fabric
forge_config_port_version=rSd3GiG8

# Mod
mod_version=1.0.0
maven_group=com.craftysearch
archives_base_name=craftysearch
